<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM Manipulation</title>
    <link rel="stylesheet" href="./styles.css">
    
</head>
<body>
    <header>
        <h1>Welcome to JavaScript DOM Manipulation</h1>
        <p>This is a simple demonstration of DOM manipulation using JavaScript.</p>
    </header>

    <section>
        <button id="changeTextButton">Change Text Content</button>
        <button id="changeStyleButton">Change Style</button>
        <button id="addElementButton">Add New Element</button>
        <button id="removeElementButton">Remove Last Element</button>
    </section>

    <section id="content">
        <h2 id="dynamicText">This text will change.</h2>
        <p id="styledText">This paragraph will change its style.</p>
    </section>

    <footer>
        <p>Created with ❤️ by Davis Ikou</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
